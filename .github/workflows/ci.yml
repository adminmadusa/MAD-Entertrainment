name: CI Workflow

on:
  push:
    branches:
      - develop
      - live
  pull_request:
    branches:
      - develop
      - live

jobs:
  build-lint-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run Type Checking
        run: pnpm run type-check

      - name: Run CI Governance Abstraction Checks
        run: npx tsx scripts/ci-governance-check.ts

      - name: Run CI Governance Diagnostics (Temporary)
        run: |
          echo "=== Executable Paths ==="
          which node || true
          which npm || true
          which pnpm || true
          which npx || true
          which tsx || true
          which esbuild || true
          which tsc || true

          echo "=== Tool Versions ==="
          node -v
          npm -v
          pnpm -v
          npx tsx --version
          npx esbuild --version

          echo "=== Git Information ==="
          git rev-parse HEAD
          git status --short
          git branch --show-current

          echo "=== Workspace Information ==="
          pwd
          ls -la .
          find scripts/governance -maxdepth 2 -type f | sort

          echo "=== File Integrity ==="
          sha256sum scripts/governance/validators/documentation_validator.ts
          wc -l scripts/governance/validators/documentation_validator.ts
          file scripts/governance/validators/documentation_validator.ts

          echo "=== Merge Marker Scan ==="
          grep -R "<<<<<<<\|=======\|>>>>>>>" scripts .github || true

          echo "=== Parser Context ==="
          nl -ba scripts/governance/validators/documentation_validator.ts | sed -n '330,390p'

          echo "=== Direct Compiler Tests ==="
          pnpm exec tsc --noEmit || true

          echo "=== Run Direct esbuild ==="
          npx esbuild scripts/governance/validators/documentation_validator.ts --bundle --platform=node --outfile=/tmp/documentation_validator.js || true

      - name: Run CI Governance Documentation Validation
        run: pnpm run governance:docs
        env:
          GOVERNANCE_MIN_HEALTH_SCORE: 50

      - name: Build Workspace
        run: pnpm run build

      - name: Run Workspace Configuration Audit
        run: pnpm run audit-data

      - name: Run Tests
        run: pnpm run test

  secret-scanning:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.7
        if: |
          github.event_name == 'pull_request' || 
          (github.event_name == 'push' && 
           github.event.before != '0000000000000000000000000000000000000000' && 
           github.event.before != github.sha)
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dependency Audit
        run: npx tsx scripts/dependency-audit.ts
