name: CI Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Lint warnings report (non-blocking)
        run: |
          pnpm --filter @mad/admin exec eslint src --max-warnings=9999
          pnpm --filter @mad/web exec eslint src --max-warnings=9999
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm type-check:apps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

  governance-checks:
    name: Governance Checks
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Governance Abstraction Checks
        run: npx tsx scripts/ci_governance_check.ts

      - name: Run Contract Compatibility Gates
        if: false # TODO(governance): restore scripts/contract_compatibility_check.ts and re-enable this gate
        run: pnpm governance:contracts:check

      - name: Run Serializer/Schema Parity Gates
        run: pnpm governance:serializer-parity

      - name: Run Workspace Configuration Audit
        run: pnpm audit-data

  unused-imports-report:
    name: Unused Imports Report
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare report output directory
        run: mkdir -p governance/hygiene/reports

      - name: Generate unused imports JSON report (admin)
        run: pnpm --filter @mad/admin exec eslint src -f json -o ../../governance/hygiene/reports/unused-imports-admin.json
        env:
          UNUSED_IMPORTS_REPORT: "1"
        continue-on-error: true

      - name: Generate unused imports JSON report (web)
        run: pnpm --filter @mad/web exec eslint src -f json -o ../../governance/hygiene/reports/unused-imports-web.json
        env:
          UNUSED_IMPORTS_REPORT: "1"
        continue-on-error: true

      - name: Generate deterministic hygiene summary
        run: npx tsx scripts/unused_imports_report.ts --admin governance/hygiene/reports/unused-imports-admin.json --web governance/hygiene/reports/unused-imports-web.json --out-json governance/hygiene/reports/unused-imports-summary.json --out-text governance/hygiene/reports/unused-imports-summary.txt --history governance/hygiene/unused-imports-history.json --update-history
        continue-on-error: true

      - name: Show hygiene summary
        run: cat governance/hygiene/reports/unused-imports-summary.txt
        continue-on-error: true

      - name: Upload unused imports artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unused-imports-report-${{ github.run_id }}
          path: |
            governance/hygiene/reports/unused-imports-admin.json
            governance/hygiene/reports/unused-imports-web.json
            governance/hygiene/reports/unused-imports-summary.json
            governance/hygiene/reports/unused-imports-summary.txt
            governance/hygiene/unused-imports-history.json
          if-no-files-found: warn

  secret-scanning:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@ec67ff26cdeb5c8600a2ca83992d9347975c172a
        if: |
          github.event_name == 'pull_request' || 
          (github.event_name == 'push' && 
           github.event.before != '0000000000000000000000000000000000000000' && 
           github.event.before != github.sha)
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod
