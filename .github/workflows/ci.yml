name: CI Workflow

on:
  push:
    branches:
      - develop
      - live
  pull_request:
    branches:
      - develop
      - live

# Least-privilege: only repository contents need to be readable.
# Individual jobs that need additional scopes (e.g. security-events) must
# declare those scopes explicitly at the job level.
permissions:
  contents: read

# Cancel any in-progress run for the same workflow + branch/PR so that
# stale runs from rapid commits do not consume runner concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        # actions/checkout v4 — pinned to immutable commit SHA
        # https://github.com/actions/checkout/releases/tag/v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        # pnpm/action-setup v3.0.0 — pinned to immutable commit SHA
        # https://github.com/pnpm/action-setup/releases/tag/v3.0.0
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        # actions/setup-node v4 — pinned to immutable commit SHA
        # https://github.com/actions/setup-node/releases/tag/v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run Type Checking
        run: pnpm run type-check

      - name: Run CI Governance Abstraction Checks (Blocking)
        run: npx tsx scripts/ci-governance-check.ts

      - name: Run CI Governance Documentation Validation (Blocking)
        run: pnpm run governance:docs --incremental
        env:
          GOVERNANCE_MIN_HEALTH_SCORE: 80

      - name: Build Workspace
        run: pnpm run build

      - name: Run Workspace Configuration Audit
        run: pnpm run audit-data

      - name: Run Tests
        run: pnpm run test

  secret-scanning:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # actions/checkout v4 — pinned to immutable commit SHA
        # https://github.com/actions/checkout/releases/tag/v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # trufflesecurity/trufflehog v3.95.7 — pinned to immutable commit SHA
        # https://github.com/trufflesecurity/trufflehog/releases/tag/v3.95.7
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           github.event.before != '0000000000000000000000000000000000000000' &&
           github.event.before != github.sha)
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # actions/checkout v4 — pinned to immutable commit SHA
        # https://github.com/actions/checkout/releases/tag/v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        # pnpm/action-setup v3.0.0 — pinned to immutable commit SHA
        # https://github.com/pnpm/action-setup/releases/tag/v3.0.0
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        # actions/setup-node v4 — pinned to immutable commit SHA
        # https://github.com/actions/setup-node/releases/tag/v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dependency Audit
        run: npx tsx scripts/dependency-audit.ts

  commit-lint:
    name: Commit Convention Validation
    # Only meaningful on pull_request — validating commit messages requires
    # a base..head range. On push to develop/live, all commits have already
    # passed this gate at PR time, so re-running would be redundant.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4 — pinned to immutable commit SHA
        # https://github.com/actions/checkout/releases/tag/v4
        # fetch-depth: 0 is required so that the full commit range
        # base..head is available for commitlint to traverse.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pnpm
        # pnpm/action-setup v3.0.0 — pinned to immutable commit SHA
        # https://github.com/pnpm/action-setup/releases/tag/v3.0.0
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        # actions/setup-node v4 — pinned to immutable commit SHA
        # https://github.com/actions/setup-node/releases/tag/v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  branch-name:
    name: Branch Name Validation
    # Validates that the source branch follows the naming convention
    # mandated by AGENTS.md: <prefix>/<lowercase-slug>
    # Allowed prefixes: feat fix refactor audit docs test chore seo
    # Runs on pull_request only — direct push branches have already
    # been validated at PR creation time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|refactor|audit|docs|test|chore|seo)/[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ Branch name '$BRANCH' is valid"
          else
            echo "❌ Branch name '$BRANCH' does not match the required pattern"
            echo ""
            echo "Allowed prefixes (AGENTS.md): feat/ fix/ refactor/ audit/ docs/ test/ chore/ seo/"
            echo "Pattern: <prefix>/<lowercase-slug-with-hyphens>"
            echo "Examples: feat/booking-seat-lock  fix/scanner-camera-stop  chore/ci-hardening"
            exit 1
          fi
