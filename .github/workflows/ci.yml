name: CI Workflow

on:
  push:
    branches:
      - develop
      - live
  pull_request:
    branches:
      - develop
      - live

jobs:
  build-lint-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run Type Checking
        run: pnpm run type-check

      - name: Run CI Governance Abstraction Checks
        run: npx tsx scripts/ci_governance_check.ts

      - name: Run CI Governance Documentation Validation
        run: pnpm run governance:docs
        env:
          # Ratchet plan: lower this value as UI governance backlog items are resolved.
          # Current count: ~1207 pre-existing warnings (raw buttons, custom modals, a11y backlog).
          # Target: reduce by ~100 per sprint until this reaches 0.
          GOVERNANCE_MAX_WARNINGS: 1300
          GOVERNANCE_MIN_HEALTH_SCORE: 50

      - name: Build Workspace
        run: pnpm run build

      - name: Run Workspace Configuration Audit
        run: pnpm run audit-data

      - name: Run Tests
        run: pnpm run test

  secret-scanning:
    name: Trufflehog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.7
        if: |
          github.event_name == 'pull_request' || 
          (github.event_name == 'push' && 
           github.event.before != '0000000000000000000000000000000000000000' && 
           github.event.before != github.sha)
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dependency Audit
        run: npx tsx scripts/dependency_audit.ts
