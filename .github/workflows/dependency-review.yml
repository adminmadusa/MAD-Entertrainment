# GOV-003: Dependency Review
# Inspects dependency changes introduced by a pull request and blocks merging
# if any newly added package contains a known vulnerability.
#
# This is distinct from the dependency-audit job in ci.yml which audits the
# full resolved dependency tree for existing vulnerabilities.  This workflow
# specifically answers: "what did this PR add or change, and is any of it
# already known-vulnerable?"
#
# Trigger: pull_request only — dependency diffs only exist in the PR context.

name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - live

# Least-privilege: only repository contents need to be readable.
permissions:
  contents: read

# Cancel any in-progress run for the same workflow + PR so that
# stale runs from rapid commits do not consume runner concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4 — pinned to immutable commit SHA
        # https://github.com/actions/checkout/releases/tag/v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependency Review
        # actions/dependency-review-action v5.0.0 — pinned to immutable commit SHA
        # https://github.com/actions/dependency-review-action/releases/tag/v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # Block merging if any newly introduced dependency has a Critical or
          # High severity vulnerability.  Medium / Low / Moderate findings are
          # reported as warnings but do not block the PR.
          fail-on-severity: high
          # Allow pre-existing exemptions that are also covered by the
          # .audit-exceptions.json registry in the dependency-audit job.
          # This prevents double-blocking on vulnerabilities that have already
          # been reviewed and accepted via that separate governance process.
          allow-ghsas: >-
            GHSA-5c6j-r48x-rmvq,
            GHSA-3jxr-9vmj-r5cp,
            GHSA-mh99-v99m-4gvg,
            GHSA-rgw5-rvv9-x895,
            GHSA-v2hh-gcrm-f6hx,
            GHSA-7p8r-x3mc-p8w7,
            GHSA-4c8g-83qw-93j6,
            GHSA-f88m-g3jw-g9cj,
            GHSA-m99w-x7hq-7vfj,
            GHSA-89xv-2m56-2m9x,
            GHSA-p9j2-gv94-2wf4,
            GHSA-6g55-p6wh-862q,
            GHSA-r28c-9q8g-f849,
            GHSA-2m8v-j782-fhvr,
            GHSA-28wg-ghj8-5hjv,
            GHSA-2v37-7h3g-55p8
